<!doctype html>
<!-- The DMG window's background (560 x 400 points; Finder shows the top ~372, the title bar takes the rest). Rendered to packaging/dmg-background.tiff by
     `npm run dmg-background`. Finder draws the icons on top: mydraw.app at (150, 175), the
     Applications link at (410, 175), icon size 100 (electron-builder.yml dmg.contents). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 560px; height: 400px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1d1b2e;
    background:
      radial-gradient(ellipse 420px 260px at 50% 0%, rgba(124, 108, 240, 0.16), transparent 70%),
      linear-gradient(180deg, #f7f5ff 0%, #ffffff 70%);
    position: relative;
  }
  h1 { position: absolute; top: 26px; width: 100%; margin: 0; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.2px; }
  .sub { position: absolute; top: 58px; width: 100%; text-align: center; font-size: 13px; color: #6b6880; }
  svg.arrow { position: absolute; left: 0; top: 0; }
  .card {
    position: absolute; left: 28px; right: 28px; top: 268px; height: 82px; box-sizing: border-box;
    padding: 14px 18px 0 62px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.92); border: 1px solid #e7e3fb;
    box-shadow: 0 1px 2px rgba(40, 30, 90, 0.05), 0 6px 18px rgba(40, 30, 90, 0.06);
    font-size: 12px; line-height: 1.45; color: #4a475e;
  }
  .card b { color: #1d1b2e; font-weight: 600; }
  .num {
    position: absolute; left: 18px; top: 16px; width: 30px; height: 30px; border-radius: 50%;
    background: #6e5ce6; color: white; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <h1>Install mydraw</h1>
  <div class="sub">Drag mydraw onto the Applications folder</div>
  <svg class="arrow" width="560" height="400" viewBox="0 0 560 400">
    <defs>
      <linearGradient id="g" x1="0" x2="1">
        <stop offset="0" stop-color="#a99cf5" />
        <stop offset="1" stop-color="#6e5ce6" />
      </linearGradient>
      <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse" markerUnits="strokeWidth">
        <path d="M 1 1 L 6 5 L 1 9" fill="none" stroke="#6e5ce6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </marker>
    </defs>
    <path d="M 222 176 C 262 140, 302 140, 338 172" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 11" marker-end="url(#head)" />
  </svg>
  <div class="card">
    <div class="num">!</div>
    <b>First launch:</b> right-click mydraw in Applications and choose <b>Open</b>.<br />
    macOS asks once, because mydraw isn’t from the App Store.<br />
    Then the <b>Set up mydraw</b> window guides you through the rest.
  </div>
</body>
</html>
