<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#4433c9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" x="100" y="100">
      <circle cx="24" cy="24" r="3.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1040" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#160b45" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#grid)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <g transform="translate(0 -28)">
  <!-- connectors -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none" stroke-opacity="0.95">
    <path d="M452 418 L352 590"/>
    <path d="M572 418 L672 590"/>
    <path d="M440 712 L584 712" stroke-dasharray="2 46"/>
  </g>

  <!-- nodes: rectangle, ellipse, diamond (Excalidraw's core shapes) -->
  <g filter="url(#soft)">
    <rect x="372" y="250" width="280" height="168" rx="34" fill="#ffffff"/>
    <circle cx="342" cy="712" r="104" fill="#ffd166"/>
    <path d="M682 600 L794 712 L682 824 L570 712 Z" fill="#5ee0b8" stroke="#5ee0b8" stroke-width="24" stroke-linejoin="round"/>
  </g>

  <!-- "screen" lines on the top node, like a server/router -->
  <g stroke="#4433c9" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M420 312 L604 312"/>
    <path d="M420 356 L540 356"/>
  </g>
  <circle cx="596" cy="356" r="12" fill="#5ee0b8"/>
  </g>
</svg>
